# Cloudflare deploy settings for the baseline-push Worker.
# Secrets (VAPID_PRIVATE, VAPID_PUBLIC, VAPID_SUBJECT, RESEND_KEY, ACCESS_KEY, AMBER_KEY)
# stay in Cloudflare and are never stored here.
name = "baseline-push"
main = "worker.js"
compatibility_date = "2024-09-23"

# keep plain-text variables set in the dashboard (ALLOW_ORIGIN, APP_URL, REPORT_FROM)
keep_vars = true

[[kv_namespaces]]
binding = "BASELINE"
id = "da5bae78b0714de4a354c3e9572dfc18"

[triggers]
# Empty on purpose. The 5-minute schedule lives on the separate baseline-timer
# worker, which calls /tick here: Cloudflare stopped running this worker's own
# schedule in Oct 2026, and the free plan's 5 schedules are all in use, so
# listing one here makes every build fail.
crons = []

[observability]
enabled = true
